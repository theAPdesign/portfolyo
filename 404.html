<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | The AP Design</title>
    <meta
      name="description"
      content="The AP Design portfolyo sayfasinda bulunamayan sayfa bildirimi."
    >
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --ink: #f7f1e8;
        --muted: #aeb7bf;
        --line: rgba(247, 241, 232, 0.16);
        --accent: #f5c84c;
        --accent-2: #6ee7d8;
        --panel: rgba(255, 255, 255, 0.055);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 18% 22%, rgba(110, 231, 216, 0.16), transparent 30%),
          radial-gradient(circle at 82% 12%, rgba(245, 200, 76, 0.18), transparent 26%),
          linear-gradient(135deg, #0f1115 0%, #171a20 54%, #0f1115 100%);
        color: var(--ink);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 20px;
      }

      .stage {
        width: min(980px, 100%);
        display: grid;
        gap: 36px;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
        align-items: center;
      }

      .mark {
        width: 74px;
        height: 74px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--accent);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .eyebrow {
        margin: 28px 0 14px;
        color: var(--accent-2);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(54px, 12vw, 136px);
        line-height: 0.86;
        letter-spacing: 0;
      }

      p {
        max-width: 54ch;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 2vw, 20px);
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 0 18px;
        background: var(--accent);
        color: #171207;
        font-weight: 800;
        text-decoration: none;
      }

      .button.secondary {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
      }

      .preview {
        position: relative;
        min-height: 430px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
      }

      .preview::before,
      .preview::after {
        content: "";
        position: absolute;
        inset: 64px;
        border: 1px solid var(--line);
        border-radius: 8px;
        transform: rotate(-8deg);
      }

      .preview::after {
        inset: 106px 42px 42px 110px;
        border-color: rgba(245, 200, 76, 0.52);
        transform: rotate(7deg);
      }

      .number {
        position: absolute;
        right: 28px;
        bottom: 22px;
        color: rgba(247, 241, 232, 0.14);
        font-size: clamp(90px, 18vw, 172px);
        font-weight: 900;
        line-height: 0.8;
      }

      @media (max-width: 760px) {
        main {
          place-items: start;
        }

        .stage {
          grid-template-columns: 1fr;
        }

        .preview {
          min-height: 280px;
        }

        h1 {
          max-width: 9ch;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="404 sayfasi">
        <div>
          <div class="mark" aria-label="The AP Design">AP</div>
          <div class="eyebrow">Sayfa bulunamadi</div>
          <h1>Bu taslak kayip.</h1>
          <p>
            Aradigin sayfa kaldirilmis, tasinmis ya da hic yayina alinmamis olabilir.
            Portfolyonun ana sayfasina donerek isleri yeniden inceleyebilirsin.
          </p>
          <div class="actions">
            <a class="button" href="/">Ana sayfaya don</a>
            <a class="button secondary" href="https://github.com/theAPdesign/portfolyo">GitHub reposu</a>
          </div>
        </div>
        <div class="preview" aria-hidden="true">
          <div class="number">404</div>
        </div>
      </section>
    </main>
  </body>
</html>
